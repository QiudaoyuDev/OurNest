<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 B · 咱家小账页面预览</title>
<style>
:root{--red:#f0442f;--ink:#302d2b;--muted:#726b67;--line:#eee8e4;--bg:#faf6f3;--soft:#fff0eb}*{box-sizing:border-box}body{margin:0;background:#f3eeea;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #922818;outline-offset:2px}.intro{max-width:1500px;margin:auto;padding:48px 36px 25px}.eyebrow{font-size:13px;font-weight:700;color:#a63829;letter-spacing:.08em}.intro h1{font-size:32px;letter-spacing:-.04em;margin:12px 0}.intro p{color:#655d58;line-height:1.7;max-width:760px;font-size:15px}.board{max-width:1500px;margin:auto;padding:8px 36px 70px;display:grid;grid-template-columns:repeat(4,minmax(300px,1fr));gap:22px;align-items:start}.unit:nth-child(even){padding-top:36px}.caption{margin:0 0 13px;font-size:14px;font-weight:700}.caption span{font-weight:400;color:var(--muted);margin-left:8px}.phone{height:790px;border:1px solid #dfd4ce;border-radius:28px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}.screen{overflow:auto;flex:1;scrollbar-width:thin}.nav{padding:26px 19px 17px;background:#fff;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:18px}.navsmall{font-size:13px;color:#766f6a;font-weight:500}.body{padding:18px 16px 28px}.context{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:var(--muted)}.context b{color:var(--ink);font-size:16px}.badge{background:#fff0eb;color:#a83726;border-radius:20px;padding:5px 9px;font-size:12px}.card{background:white;border:1px solid #f0e9e5;border-radius:16px;padding:17px;margin-bottom:12px}.section{display:flex;justify-content:space-between;align-items:center;margin:25px 1px 12px;font-size:16px;font-weight:700}.section button,.link{border:0;background:none;color:#b63828;font-size:13px;padding:4px}.label{font-size:13px;color:var(--muted)}.total{font-size:31px;font-weight:750;letter-spacing:-.04em;margin:8px 0 17px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary div+div{border-left:1px solid var(--line);padding-left:12px}.summary b{display:block;margin-top:7px;font-size:15px}.red{color:#d43d2a}.progress{height:7px;background:#f5e9e4;border-radius:8px;overflow:hidden;margin:14px 0 10px}.progress i{display:block;height:100%;background:var(--red);border-radius:8px}.row{display:flex;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid #f3eeeb}.row:last-child{border-bottom:0}.rowbutton{width:100%;border:0;background:none;text-align:left;color:inherit}.icon{width:38px;height:38px;border-radius:12px;background:#fff1e9;color:#b04d31;display:grid;place-items:center;font-size:17px;flex:none}.info{min-width:0;flex:1}.info strong{display:block;font-size:14px}.info small{display:block;color:#817974;font-size:12px;margin-top:5px}.amount{font-weight:700;font-size:15px;white-space:nowrap}.tabs{display:flex;align-items:center;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:9px 8px 15px;flex:none}.tabs button{border:0;background:transparent;color:#766e68;font-size:12px;padding:5px 10px}.tabs .active{color:#d13a28;font-weight:700}.tabs .add{color:white;background:var(--red);border-radius:50%;width:39px;height:39px;font-size:24px;padding:0}.seg{display:flex;background:#f0ebe8;border-radius:10px;padding:3px;gap:2px;margin:14px 0}.seg button{flex:1;border:0;background:transparent;padding:8px 2px;color:#6c645f;border-radius:8px;font-size:13px}.seg .on{background:white;color:#c83c2a;font-weight:700}.month{display:flex;justify-content:space-between;align-items:center;font-weight:700}.month button{border:0;background:transparent;font-size:18px;color:#7c716b;padding:4px 10px}.day{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:19px 2px 6px}.detail-head{text-align:center;padding:22px 0}.detail-head .icon{margin:0 auto 12px}.detail-head .total{margin:8px 0}.field{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:14px;border-bottom:1px solid #f3eeeb}.field:last-child{border:0}.field span:first-child{color:var(--muted)}.note{font-size:12px;color:#71645e;line-height:1.6}.bars{height:120px;display:flex;align-items:end;gap:12px;padding:14px 4px 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:#f3c4b9;border-radius:5px 5px 0 0;min-height:4px}.bar.current{background:var(--red)}.chart-labels{display:flex;justify-content:space-between;font-size:11px;color:#817974;margin-top:8px}.category{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:13px;margin-top:15px}.category .progress{grid-column:1/-1;margin:0;height:6px}.hint{background:#fff8f3;border:1px solid #f2e0d6;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;color:#715c51}.footer-note{max-width:1500px;margin:auto;padding:0 36px 40px;color:#716a65;font-size:13px;line-height:1.7}@media(max-width:1350px){.board{grid-template-columns:repeat(2,minmax(300px,1fr));max-width:800px}}@media(max-width:700px){.intro{padding:30px 18px 18px}.intro h1{font-size:26px}.board{display:block;padding:0 18px 30px}.unit,.unit:nth-child(even){padding:0 0 28px}.phone{height:740px}.footer-note{padding:0 18px 30px}}
</style>
</head>
<body>
<header class="intro"><div class="eyebrow">咱家小账 · 方向 B</div><h1>从本月处境，找到每一笔的来处</h1><p>先看本月，再回到记录，最后理解变化。保留现有暖红与卡片语言，用清楚的范围和可追溯的数据建立信任。下方是独立的页面方向初稿，不连接真实账本；所有人物、金额和日期均为虚构示例。</p></header>
<main class="board" id="board"></main>
<footer class="footer-note">交互说明：各屏可独立切换底部导航；点击任意记录会打开同一条虚构示例详情；分析分类入口展示通用明细，不模拟实际筛选。其他筛选和记账入口仅用于展示，不执行真实操作。页面为方向比较稿，状态、权限及统计口径仍需结合产品和服务端确认。</footer>
<script>
const tabs=(active)=>`<nav class="tabs" aria-label="页面导航"><button data-go="home" class="${active==='home'?'active':''}">首页</button><button data-go="records" class="${active==='records'?'active':''}">明细</button><button class="add" data-demo="记账为展示入口" aria-label="记一笔">＋</button><button data-go="analysis" class="${active==='analysis'?'active':''}">分析</button><button data-demo="我的页面未在本次预览范围内">我的</button></nav>`;
const item=(icon,title,sub,amount)=>`<button class="row rowbutton" data-go="detail"><span class="icon">${icon}</span><span class="info"><strong>${title}</strong><small>${sub}</small></span><span class="amount">${amount}</span></button>`;
const views={
home:()=>`<div class="nav"><span>咱家小账</span><span class="navsmall">我们的账本 ﹀</span></div><div class="body"><div class="context"><b>6月，你们的账</b><span class="badge">共享账本</span></div><div class="card"><div class="label">本月结余</div><div class="total">¥2,800.00</div><div class="summary"><div><span class="label">收入</span><b>¥8,000</b></div><div><span class="label">支出</span><b>¥5,200</b></div><div><span class="label">记录</span><b>24 笔</b></div></div></div><div class="card"><div style="display:flex;justify-content:space-between"><strong>本月预算</strong><span class="label">已使用 87%</span></div><div class="progress"><i style="width:86.7%"></i></div><div style="display:flex;justify-content:space-between;font-size:13px"><span>剩余 <b class="red">¥800</b></span><span class="label">¥5,200 / ¥6,000</span></div></div><div class="section">最近记录 <button data-go="records">查看全部 ›</button></div><div class="card" style="padding-top:2px;padding-bottom:2px">${item('餐','餐饮','今天 12:30 · 小林','−¥120.00')}${item('购','日用百货','昨天 19:20 · 小周','−¥86.00')}${item('薪','工资','6月10日 · 小林','+¥8,000.00')}</div><p class="note">最近记录显示账本最近发生的交易，不限本月。</p></div>`,
records:()=>`<div class="nav"><span>明细</span><span class="navsmall">我们的账本 ﹀</span></div><div class="body"><div class="month"><button data-demo="月份切换仅作展示" aria-label="上个月">‹</button><span>2026年6月</span><button data-demo="月份切换仅作展示" aria-label="下个月">›</button></div><div class="seg"><button class="on" data-demo="筛选仅作展示">全部</button><button data-demo="筛选仅作展示">支出</button><button data-demo="筛选仅作展示">收入</button></div><div class="card"><div class="label">本月收支 · 全部记录</div><div class="summary" style="margin-top:14px"><div><span class="label">收入</span><b>¥8,000</b></div><div><span class="label">支出</span><b>¥5,200</b></div><div><span class="label">结余</span><b>¥2,800</b></div></div></div><div class="day"><span>6月12日 · 星期五</span><span>支出 ¥120.00</span></div><div class="card" style="padding-top:0;padding-bottom:0">${item('餐','餐饮','12:30 · 小林 · 午餐','−¥120.00')}</div><div class="day"><span>6月11日 · 星期四</span><span>支出 ¥86.00</span></div><div class="card" style="padding-top:0;padding-bottom:0">${item('购','日用百货','19:20 · 小周','−¥86.00')}</div><div class="day"><span>6月10日 · 星期三</span><span>收入 ¥8,000.00</span></div><div class="card" style="padding-top:0;padding-bottom:0">${item('薪','工资','09:00 · 小林','+¥8,000.00')}</div><p class="note">示例仅展示部分记录。实际列表按日期分页加载。</p></div>`,
detail:()=>`<div class="nav"><span><button class="link" data-go="records" aria-label="返回明细">‹ 返回</button> 记录详情</span><span class="navsmall">只读预览</span></div><div class="body"><div class="detail-head"><div class="icon">餐</div><div class="label">餐饮 · 支出</div><div class="total">−¥120.00</div><div class="label">2026年6月12日 12:30</div></div><div class="card"><strong>交易信息</strong><div class="field"><span>账本</span><span>我们的账本</span></div><div class="field"><span>账户</span><span>日常账户</span></div><div class="field"><span>备注</span><span>午餐</span></div></div><div class="card"><strong>家庭记录</strong><div class="field"><span>记录人</span><span>小林</span></div><div class="field"><span>付款人</span><span>小林</span></div><div class="field"><span>消费归属</span><span>共同</span></div></div><div class="hint">付款人、消费归属与记录人是不同的信息。这里展示的是一条虚构示例，不代表结算结果。</div></div>`,
analysis:()=>`<div class="nav"><span>分析</span><span class="navsmall">我们的账本 ﹀</span></div><div class="body"><div class="month"><button data-demo="周期切换仅作展示" aria-label="上月">‹</button><span>2026年6月</span><button data-demo="周期切换仅作展示" aria-label="下月">›</button></div><div class="seg"><button data-demo="周期切换仅作展示">周</button><button class="on" data-demo="周期切换仅作展示">月</button><button data-demo="周期切换仅作展示">年</button><button data-demo="周期切换仅作展示">自定义</button></div><div class="context"><b>本月支出</b><span class="badge">6月1日—6月30日</span></div><div class="card"><div class="label">支出总额</div><div class="total">¥5,200.00</div><div class="summary"><div><span class="label">笔数</span><b>24 笔</b></div><div><span class="label">日均</span><b>¥173.33</b></div><div><span class="label">较上月</span><b>−8.2%</b></div></div></div><div class="section">钱花在了哪里 <button data-go="records">查看明细 ›</button></div><div class="card"><button class="row rowbutton" data-go="records" style="padding:0 0 10px"><span class="info"><strong>餐饮</strong><small>8 笔 · 占支出 38.5%</small></span><span class="amount">¥2,000 ›</span></button><div class="category"><span>居家日用</span><b>¥1,400</b><div class="progress"><i style="width:27%"></i></div></div><div class="category"><span>交通出行</span><b>¥800</b><div class="progress"><i style="width:15.4%"></i></div></div><div class="category"><span>其他</span><b>¥1,000</b><div class="progress"><i style="width:19.2%"></i></div></div></div><div class="section">支出趋势 <span class="label">按周查看</span></div><div class="card"><div class="bars" aria-label="示例趋势图：第1周1200元，第2周1600元，第3周1400元，第4周1000元"><div class="bar" style="height:60%"></div><div class="bar" style="height:80%"></div><div class="bar" style="height:70%"></div><div class="bar current" style="height:50%"></div></div><div class="chart-labels"><span>第1周 ¥1,200</span><span>第2周 ¥1,600</span><span>第3周 ¥1,400</span><span>第4周 ¥1,000</span></div></div><div class="hint">付款统计不等于应承担金额；本预览不推算 AA 转账。</div></div>`};
const specs=[['home','首页','本月处境'],['records','明细','从范围到记录'],['detail','详情','核对单笔信息'],['analysis','分析','组成与变化']];
const board=document.querySelector('#board');
function render(unit,screen){unit.querySelector('.screen').innerHTML=views[screen]();unit.querySelector('.screen').scrollTop=0;unit.querySelector('.tabs-wrap').innerHTML=tabs(screen);}
for(const [screen,title,desc] of specs){const unit=document.createElement('section');unit.className='unit';unit.innerHTML=`<h2 class="caption">${title}<span>${desc}</span></h2><div class="phone"><div class="screen"></div><div class="tabs-wrap"></div></div>`;board.appendChild(unit);render(unit,screen);unit.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.go)render(unit,target.dataset.go);if(target.dataset.demo)alert(target.dataset.demo+'。本预览不连接真实数据。');});}
</script>
</body>
</html>
